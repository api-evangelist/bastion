aid: bastion
name: Bastion
description: >-
  Bastion is a full-stack, regulated stablecoin infrastructure platform for
  enterprises and financial institutions. Founded in 2023 and based in Campbell,
  California by former a16z crypto leaders, Bastion lets companies securely issue,
  custody, move, and convert USD-backed stablecoins under Bastion's licenses or
  their own. Its API-first product suite spans a Regulated Wallet API (create
  unlimited custodial wallets with Cloud HSM and enclave-based key management),
  stablecoin issuance, on/off-ramps, and payments, plus Compliance-as-a-Service
  that handles KYC and AML. Bastion Platforms Trust Company, LLC is chartered as
  a limited purpose trust company by the New York State Department of Financial
  Services, and Bastion Platforms US, LLC is a registered MSB (NMLS ID 2523302)
  with broad money-transmitter-license coverage across the United States. Bastion
  has raised over $40M from a16z crypto, Coinbase Ventures, and others.
